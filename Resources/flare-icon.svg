<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <radialGradient id="field" cx="512" cy="496" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFB347"/>
      <stop offset="0.36" stop-color="#F9772F"/>
      <stop offset="0.74" stop-color="#D9401A"/>
      <stop offset="1"    stop-color="#9E2610"/>
    </radialGradient>
    <radialGradient id="core" cx="512" cy="496" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFBEF"/>
      <stop offset="0.26" stop-color="#FFE6A3"/>
      <stop offset="0.58" stop-color="#FFB347" stop-opacity="0.7"/>
      <stop offset="1"    stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0"   stop-color="#FFE9B8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFBEF" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#FFE9B8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- macOS-style drop shadow -->
  <rect x="100" y="114" width="824" height="824" rx="184" fill="#000" opacity="0.28" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <!-- the screen, lit -->
    <rect x="100" y="100" width="824" height="824" fill="url(#field)"/>

    <!-- pulse rings, the repeat flash -->
    <g fill="none" stroke="#FFE3B3" stroke-width="7">
      <circle cx="512" cy="496" r="190" opacity="0.32"/>
      <circle cx="512" cy="496" r="300" opacity="0.2"/>
      <circle cx="512" cy="496" r="412" opacity="0.12"/>
    </g>

    <!-- anamorphic streak -->
    <rect x="130" y="490" width="764" height="12" fill="url(#streak)" filter="url(#soft)"/>

    <!-- hot core -->
    <circle cx="512" cy="496" r="230" fill="url(#core)"/>
    <circle cx="512" cy="496" r="56" fill="#FFFBEF"/>

    <!-- faint rim so it sits well next to other icons -->
    <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.16"/>
  </g>
</svg>
